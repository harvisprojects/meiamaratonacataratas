<meta charset="utf-8">
<title>Meia 3 Fronteiras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: one column, generous white space. Landing = hero + stacked sections. Inscrição, checkout e portal = página estreita própria. */
:root{
  --bg:#FFFFFF; --soft:#F4F4F2; --line:#E4E4E1; --fg:#0F0F0E; --muted:#6A6A66;
  --accent:#0A5BD3; --accent-ink:#FFFFFF;
  --ok:#12805C; --warn:#9A5800; --crit:#C02626;
  --f-display:"Archivo","Arial Narrow",sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0D0C; --soft:#171716; --line:#2A2A28; --fg:#F2F2EF; --muted:#9C9C97;
  --accent:#6AA2FF; --accent-ink:#06142B; --ok:#4FD69C; --warn:#F2B44C; --crit:#FF7D7D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0D0C; --soft:#171716; --line:#2A2A28; --fg:#F2F2EF; --muted:#9C9C97;
  --accent:#6AA2FF; --accent-ink:#06142B; --ok:#4FD69C; --warn:#F2B44C; --crit:#FF7D7D; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.narrow{max-width:640px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;height:64px}
.logo{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:20px;letter-spacing:.02em;text-transform:uppercase;text-decoration:none;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer}
.links{display:flex;gap:22px;margin-right:auto}
.links button{background:none;border:0;padding:0;cursor:pointer;font-size:14px;color:var(--muted)}
.links button:hover{color:var(--fg)}
.top-r{display:flex;gap:10px;align-items:center;margin-left:auto}
@media (max-width:860px){.links{display:none}}
@media (max-width:420px){.top .hide-xs{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);padding:12px 22px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{opacity:.88}
.btn-ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--fg);opacity:1}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-sm{padding:8px 16px;font-size:14px}
.btn-lg{padding:16px 30px;font-size:17px}
.btn-block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;font-size:14px}

/* hero */
.hero{padding-block:72px 56px;border-bottom:1px solid var(--line)}
.hero h1{font-family:var(--f-display);font-stretch:68%;font-weight:800;text-transform:uppercase;font-size:clamp(52px,10.5vw,148px);line-height:.86;letter-spacing:-.01em}
.hero h1 span{display:block}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:28px;font-size:18px}
.hero-meta b{font-weight:600}
.hero-cta{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;margin-top:36px}
.count{display:flex;gap:18px}
.count div{display:flex;flex-direction:column}
.count b{font-family:var(--f-mono);font-size:26px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.count span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.strip{margin-top:56px}
.strip-line{display:grid;grid-template-columns:1fr 1.3fr 1fr;height:4px;gap:4px}
.strip-line i{background:var(--fg)}
.strip-line i:nth-child(2){background:var(--accent)}
.strip-lbl{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:4px;margin-top:12px;font-size:13px}
.strip-lbl div{display:flex;flex-direction:column;gap:2px;min-width:0}
.strip-lbl b{font-weight:600}
.strip-lbl div:last-child{text-align:right}

/* sections */
.sec{padding-block:80px;border-bottom:1px solid var(--line)}
.sec-h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px 48px;align-items:start}
.sec-h h2{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:clamp(32px,4vw,48px);line-height:1;text-transform:uppercase}
@media (max-width:820px){.sec-h{grid-template-columns:1fr}.sec{padding-block:56px}}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.cols>*{background:var(--bg);padding:28px;min-width:0}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.price{font-family:var(--f-display);font-stretch:75%;font-weight:700;font-size:44px;line-height:1;margin:14px 0 6px}
.km{font-family:var(--f-display);font-stretch:68%;font-weight:800;font-size:72px;line-height:.9}
.km small{font-size:28px}
.dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px 16px;margin:18px 0 0;font-size:15px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.prose{display:flex;flex-direction:column;gap:14px;max-width:62ch}
details{border-bottom:1px solid var(--line)}
details:first-child{border-top:1px solid var(--line)}
summary{cursor:pointer;list-style:none;padding:20px 0;font-weight:600;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details[open] summary::after{content:"−"}
details p{padding:0 0 20px;color:var(--muted);max-width:62ch}
footer{padding-block:40px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* flow pages */
.flow{padding-block:48px 80px}
.flow h1{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:clamp(36px,6vw,56px);line-height:1;text-transform:uppercase;margin:10px 0 8px}
.block{padding-block:28px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.block h2{font-size:15px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.block h2 .mono{color:var(--muted);font-size:12px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.seg label{position:relative;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.seg b{font-weight:600}
.seg span{font-size:14px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.full{grid-column:1/-1}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:13px;color:var(--muted)}
.f input,.f select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px}
.f input:focus,.f select:focus{outline:none;border-color:var(--fg)}
.f input[type=file]{padding:10px}
.f .err{color:var(--crit);font-size:13px}
.f.bad input,.f.bad select{border-color:var(--crit)}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:3px;accent-color:var(--fg);flex:none}
.chk .err{display:block;color:var(--crit);font-size:13px}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-block:24px;border-top:1px solid var(--line)}
.total b{font-family:var(--f-display);font-stretch:75%;font-size:40px;font-weight:700;line-height:1}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

/* gateway checkout (generic stand-in) */
.gw-bar{background:var(--soft);border-bottom:1px solid var(--line)}
.gw-bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;height:56px;font-size:14px}
.gw-lock{display:flex;gap:8px;align-items:center;font-weight:600}
.gw{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;padding-block:40px 80px;align-items:start}
@media (max-width:820px){.gw{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:16px;padding:24px;min-width:0}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:999px;margin-bottom:20px}
.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs button:disabled{cursor:not-allowed;opacity:.5}
.qr{background:#FFFFFF;padding:12px;border-radius:12px;display:inline-block;line-height:0;border:1px solid var(--line)}
.qr svg{width:168px;height:168px;display:block}
.pixcode{font-family:var(--f-mono);font-size:11px;word-break:break-all;background:var(--soft);padding:12px;border-radius:10px;color:var(--muted)}
.sum{display:flex;flex-direction:column;gap:10px;font-size:15px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .t{border-top:1px solid var(--line);padding-top:12px;font-weight:700;font-size:18px}
.note{font-size:13px;color:var(--muted);padding:12px 14px;border-radius:10px;background:var(--soft)}
.alert{font-size:14px;padding:12px 14px;border-radius:10px;border:1px solid var(--crit);color:var(--crit)}

/* portal */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.b-ok{color:var(--ok)}.b-warn{color:var(--warn)}.b-crit{color:var(--crit)}.b-muted{color:var(--muted)}
.bib{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding-block:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (max-width:520px){.bib{grid-template-columns:1fr}}
.bib .n{font-family:var(--f-display);font-stretch:68%;font-weight:800;font-size:96px;line-height:.85}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 16px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
@media (max-width:520px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:8px}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:14px;z-index:60;max-width:calc(100% - 40px)}
.demo{font-size:12px;color:var(--muted);text-align:center;padding:10px 20px;border-top:1px solid var(--line)}
/* organizador */
.otabs{display:flex;gap:28px;overflow-x:auto;overflow-y:hidden;border-bottom:1px solid var(--line);margin-bottom:36px;scrollbar-width:none}
.otabs button{background:none;border:0;padding:16px 0 14px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.otabs button[aria-current="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.cnt{font-family:var(--f-mono);font-size:11px;background:var(--fg);color:var(--bg);border-radius:999px;padding:1px 7px;margin-left:4px}
.oh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.oh h1{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:40px;line-height:1;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:40px}
.stats>div{background:var(--bg);padding:22px;min-width:0;display:flex;flex-direction:column;gap:6px}
.stats b{font-family:var(--f-display);font-stretch:75%;font-weight:700;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:40px 48px;margin-bottom:40px}
.ogrid h3,.osec{font-size:13px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px;border-bottom:1px solid var(--line)}
.bars i{flex:1;background:var(--fg);min-height:2px;position:relative}
.bars i.part{opacity:.3}
.bars-x{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:6px}
.split{display:flex;flex-direction:column;gap:10px}
.split div{display:grid;grid-template-columns:96px minmax(0,1fr) 48px;gap:12px;align-items:center;font-size:14px}
.split .tr{height:6px;background:var(--soft)}
.split .tr i{display:block;height:100%;background:var(--fg)}
.split .v{text-align:right;font-family:var(--f-mono);font-size:13px}
.todo{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.todo button{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 0;cursor:pointer;text-align:left}
.todo button:hover span:first-child{text-decoration:underline}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:10px 12px 10px 0;border-bottom:1px solid var(--fg);white-space:nowrap}
td{padding:14px 12px 14px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.filters .f{flex:1 1 160px}
.filters .f.grow{flex:3 1 260px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.item:first-child{border-top:1px solid var(--line)}
@media (max-width:640px){.item{grid-template-columns:1fr}}
.item select{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13px}
.evi{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.evi li{display:flex;gap:10px}
.evi .y{color:var(--ok)}.evi .n{color:var(--crit)}.evi .q{color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 48px) max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--bg);border-radius:16px;width:100%;max-width:640px;padding:28px;display:flex;flex-direction:column;gap:20px;min-width:0}
.x{border:1px solid var(--line);background:var(--bg);width:36px;height:36px;border-radius:999px;cursor:pointer;font-size:18px;flex:none}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}.btn,.seg label{transition:opacity .15s,border-color .15s,box-shadow .15s}}
</style>

<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";
const DAY=864e5;
/* datas da edição 2026; o "hoje" do protótipo é simulado para o site aparecer com inscrições abertas */
const SIM_TODAY=new Date('2026-08-20T10:00:00-03:00').getTime(),LOAD=Date.now(),simNow=()=>SIM_TODAY+(Date.now()-LOAD);
const EVENT=new Date('2026-10-11T06:30:00-03:00');
const PRICE={geral:300,reduzido:250},FEE=20,MAX_INST=6,INST_RATE=.0199,CHANGE_FEE=80;
const KEY='tf-v4';
const DOCS={BR:['RG','CNH','Passaporte'],PY:['Cédula de identidad','Pasaporte'],AR:['DNI','Pasaporte'],XX:['Passaporte']};
const COUNTRIES=[['BR','Brasil'],['PY','Paraguai'],['AR','Argentina'],['XX','Outro país']];

let DB={regs:[],session:null};
try{const s=localStorage.getItem(KEY);if(s)DB=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
const S={draft:null,errors:{},pay:'pix',inst:1,cardErr:'',login:{email:'',sent:false,err:''},flash:'',cancel:null,checkout:null};

/* utils */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}),money=v=>BRL.format(v);
const fmtDT=ms=>new Date(ms).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
function cpfOk(v){v=String(v).replace(/\D/g,'');if(v.length!==11||/^(\d)\1+$/.test(v))return false;let s=0;for(let i=0;i<9;i++)s+=+v[i]*(10-i);let d=(s*10)%11%10;if(d!==+v[9])return false;s=0;for(let i=0;i<10;i++)s+=+v[i]*(11-i);d=(s*10)%11%10;return d===+v[10]}
function genCPF(rand){rand=rand||Math.random;const n=[];for(let i=0;i<9;i++)n.push(Math.floor(rand()*10));let s=0;for(let i=0;i<9;i++)s+=n[i]*(10-i);n.push((s*10)%11%10);s=0;for(let i=0;i<10;i++)s+=n[i]*(11-i);n.push((s*10)%11%10);const x=n.join('');return x.slice(0,3)+'.'+x.slice(3,6)+'.'+x.slice(6,9)+'-'+x.slice(9)}
function luhn(n){n=String(n).replace(/\D/g,'');if(n.length<13)return false;let s=0,alt=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(alt){d*=2;if(d>9)d-=9}s+=d;alt=!alt}return s%10===0}
function ageAt(b){const d=new Date(b+'T12:00:00');let a=EVENT.getFullYear()-d.getFullYear();const m=EVENT.getMonth()-d.getMonth();if(m<0||(m===0&&EVENT.getDate()<d.getDate()))a--;return a}
function qr(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){return '<span class="mono" style="color:#111">'+esc(text)+'</span>'}}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3500)}
const modLabel=m=>m==='21'?'21 km':'10,5 km';
const catLabel=c=>({geral:'Geral','60':'60+',pcd:'PCD',cad:'Cadeirante'})[c];

function render(){

}

function capture(){
  const d=D();
  document.querySelectorAll('[data-f]').forEach(el=>{const k=el.dataset.f;
    if(el.type==='radio'){if(el.checked)d[k]=el.value}
    else if(el.type==='checkbox')d[k]=el.checked;
    else if(el.type==='file'){if(el.files&&el.files[0])d[k]=el.files[0].name}
    else d[k]=el.value});
}
function validate(){
  const d=D(),e={},req='Preencha este campo.';
  ['name','birth','sex','email','phone','shirt','emergency'].forEach(k=>{if(!String(d[k]).trim())e[k]=req});
  if(d.country==='BR'){if(!cpfOk(d.cpf))e.cpf='CPF inválido. Confira os 11 dígitos.'}else if(!d.docNum.trim())e.docNum=req;
  if(d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email))e.email='E-mail inválido.';
  if(!d.docFile)e.docFile='Anexe a foto do documento.';
  if(d.cat==='pcd'&&!d.laudoFile)e.laudoFile='Anexe o laudo médico.';
  if(d.cat==='60'&&d.birth&&ageAt(d.birth)<60)e.cat='A categoria 60+ exige 60 anos ou mais no dia da prova.';
  if(!d.t1)e.t1='Aceite para continuar.';if(!d.t2)e.t2='Aceite para continuar.';
  const key=d.country==='BR'?d.cpf.replace(/\D/g,''):d.docNum.trim();
  if(key&&DB.regs.some(r=>r.status==='pago'&&(r.country==='BR'?r.cpf.replace(/\D/g,''):r.docNum)===key)){if(d.country==='BR')e.cpf='Já existe uma inscrição paga com este CPF.';else e.docNum='Já existe uma inscrição paga com este documento.'}
  S.errors=e;return !Object.keys(e).length;
}

function confirmPayment(r,method,inst){
  const t=totals(r,inst);
  const bibs=DB.regs.filter(x=>x.modality===r.modality&&x.bib).map(x=>x.bib);
  Object.assign(r,{status:'pago',method,inst,interest:t.interest,total:t.total,paidAt:simNow(),bib:bibs.length?Math.max.apply(null,bibs)+1:(r.modality==='21'?101:5001)});
  DB.session=r.email.toLowerCase();save();
  S.checkout=null;S.flash='Pagamento aprovado. Esta é a sua Área do atleta.';S.cardErr='';S.errors={};S.draft=null;
  go('portal');
}

function evidence(r){return[
  ['Aceite do regulamento e do termo, com data e IP',true,fmtDT(r.created)+' · IP '+(r.ip||'—')],
  ['Comprovante enviado por e-mail',true,'entregue em '+fmtDT(r.paidAt||r.created)],
  ['Documento com foto do atleta',r.doc==='aprovado'?true:null,esc(r.docFile)+' · '+docTxt[r.doc][0].toLowerCase()],
  ['Política de reembolso aceita no checkout',true,'7 dias corridos, art. 49 do CDC'],
  ['Pedido de cancelamento feito pelo atleta',false,'nenhum pedido registrado'],
  ['Retirada do kit com documento',r.kit?true:null,r.kit?'retirado em '+fmtDT(r.kitAt):'retirada só na semana da prova']]}
function oDisp(){
  const list=DB.regs.filter(r=>r.dispute).sort((a,b)=>a.dispute.deadline-b.dispute.deadline);
  return '<div class="oh"><div><p class="eyebrow">Chargebacks no cartão</p><h1 style="margin-top:8px">Contestações</h1></div></div>'+
  '<p class="muted small" style="max-width:62ch;margin-bottom:24px">O titular do cartão pede ao banco para desfazer a compra. O gateway segura o valor e você tem um prazo para mandar provas. O sistema já junta as provas que tem: aceite com IP, e-mail de confirmação, documento e retirada do kit.</p>'+
  (list.length?list.map(r=>{const d=r.dispute,left=Math.ceil((d.deadline-SIM_TODAY)/DAY),open=d.status==='aberta';
    return '<div class="item" style="align-items:start"><div style="min-width:0">'+
    '<div class="row" style="gap:16px">'+(open?'<span class="badge b-crit">Aberta</span>':d.status==='defesa enviada'?'<span class="badge b-warn">Defesa enviada</span>':'<span class="badge b-muted">Perdida</span>')+(open?'<span class="mono small'+(left<=3?'" style="color:var(--crit)':'')+'">responder até '+fmtD(d.deadline)+' · '+left+(left===1?' dia':' dias')+'</span>':'')+'</div>'+
    '<p style="margin-top:10px"><b style="font-weight:600">'+esc(r.name)+'</b> · '+money(d.amount)+' · cartão '+r.inst+'x</p><p class="small muted">'+esc(d.reason)+' · '+esc(r.protocol)+'</p>'+
    (ORG.disp===r.id?'<ul class="evi">'+evidence(r).map(([l,ok,det])=>'<li><span class="'+(ok?'y':ok===false?'n':'q')+'">'+(ok?'✓':ok===false?'✗':'·')+'</span><span>'+l+'<br><span class="small muted">'+det+'</span></span></li>').join('')+'</ul>':'')+
    '</div>'+(open?'<div class="row">'+(ORG.disp===r.id?'<button class="btn btn-sm" data-oa="disp-send" data-id="'+r.id+'">Enviar defesa</button>':'<button class="btn btn-sm" data-oa="disp-open" data-id="'+r.id+'">Ver provas</button>')+'<button class="btn btn-ghost btn-sm" data-oa="disp-accept" data-id="'+r.id+'">Aceitar e devolver</button></div>':'')+'</div>'}).join('')
  :'<p class="muted">Nenhuma contestação.</p>');
}
function oKits(){
  const paid=DB.regs.filter(r=>PAIDS.includes(r.status)),done=paid.filter(r=>r.kit).sort((a,b)=>b.kitAt-a.kitAt);
  const q=norm(ORG.kitQ).trim(),qd=q.replace(/\D/g,'');
  const res=q?paid.filter(r=>String(r.bib)===q||norm(r.protocol)===q||norm(r.name).includes(q)||(qd.length>=6&&r.cpf.replace(/\D/g,'')===qd)).slice(0,6):[];
  const s=ORG.kitSel?byId(ORG.kitSel):null;
  let sel='';
  if(s)sel='<div class="bib" style="margin-top:28px"><p class="n">'+s.bib+'</p><div style="min-width:0"><p style="font-weight:600;font-size:20px">'+esc(s.name)+'</p><p class="small muted" style="margin-top:4px">'+modLabel(s.modality)+' · camiseta <b style="color:var(--fg)">'+esc(s.shirt)+'</b> · '+flagTxt[s.country]+' · '+esc(s.docType)+' '+esc(s.cpf||s.docNum)+'</p>'+
    (s.doc!=='aprovado'?'<p class="small" style="color:var(--warn);margin-top:10px">Documento '+docTxt[s.doc][0].toLowerCase()+'. Confira o original com atenção.</p>':'')+
    (s.status==='contestado'?'<p class="small" style="color:var(--crit);margin-top:6px">Pagamento em contestação. Fale com a coordenação antes de entregar.</p>':'')+
    (s.kit?'<p class="small" style="color:var(--ok);margin-top:12px">Kit já entregue em '+fmtDT(s.kitAt)+'.</p>':'<label class="chk" style="margin-top:16px"><input type="checkbox" id="kdoc"><span>Conferi o documento com foto.</span></label><button class="btn" style="margin-top:14px" data-oa="kit-ok" data-id="'+s.id+'">Confirmar entrega</button>')+'</div></div>';
  return '<div class="oh"><div><p class="eyebrow">Balcão de retirada</p><h1 style="margin-top:8px">Entrega de kits</h1></div><span class="mono small muted">'+done.length+' / '+paid.length+' entregues</span></div>'+
  '<form data-form="okit" class="row" style="align-items:flex-end;max-width:640px"><div class="f" style="flex:1 1 260px"><label for="kq">Nº de peito, nome, CPF ou protocolo</label><input id="kq" value="'+esc(ORG.kitQ)+'" placeholder="ex.: 101"></div><button class="btn" type="submit">Buscar</button></form>'+
  '<p class="small muted" style="margin-top:10px">No sistema real, o voluntário lê o QR code do atleta com a câmera do celular e cai direto aqui.</p>'+
  (q&&!s?(res.length?'<div class="todo" style="margin-top:20px;max-width:640px">'+res.map(r=>'<button data-oa="kit-sel" data-id="'+r.id+'"><span><span class="mono">'+r.bib+'</span> · '+esc(r.name)+'</span><span class="small muted">'+(r.kit?'entregue':modLabel(r.modality))+'</span></button>').join('')+'</div>':'<p class="small" style="margin-top:16px">Ninguém encontrado.</p>'):'')+sel+
  (done.length?'<p class="osec" style="margin-top:48px">Últimas entregas</p><div class="tbl"><table><thead><tr><th>Peito</th><th>Atleta</th><th>Camiseta</th><th>Horário</th></tr></thead><tbody>'+done.slice(0,10).map(r=>'<tr><td class="mono">'+r.bib+'</td><td>'+esc(r.name)+'</td><td>'+r.shirt+'</td><td class="mono small">'+fmtDT(r.kitAt)+'</td></tr>').join('')+'</tbody></table></div>':'');
}
function oModal(){
  const r=byId(ORG.sel);if(!r)return '';
  const kv=(l,v)=>'<dt>'+l+'</dt><dd>'+v+'</dd>';
  let act='';
  if(r.status==='pago'){
    act=ORG.confirm?'<div class="note" style="color:var(--fg)">Devolver <b>'+money(r.total)+'</b> para '+esc(r.name)+'? O número '+r.bib+' fica livre e a vaga volta para a venda.<div class="row" style="margin-top:12px"><button class="btn btn-sm" style="background:var(--crit);border-color:var(--crit);color:var(--bg)" data-oa="refund-ok" data-id="'+r.id+'">Confirmar reembolso</button><button class="btn btn-ghost btn-sm" data-oa="refund-no">Voltar</button></div></div>'
    :'<div class="row">'+(r.doc==='analise'?'<button class="btn btn-sm" data-oa="doc-ok" data-id="'+r.id+'">Aprovar documento</button>':'')+'<button class="btn btn-ghost btn-sm" data-oa="resend" data-id="'+r.id+'">Reenviar comprovante</button><button class="link" style="color:var(--crit);margin-left:auto" data-oa="refund" data-id="'+r.id+'">Reembolsar</button></div>';
  }else if(r.status==='contestado')act='<button class="btn btn-sm" data-oa="goto-disp" data-id="'+r.id+'">Ver contestação</button>';
  return '<div class="overlay" data-oa="close"><div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(r.name)+'">'+
  '<div class="row between" style="align-items:flex-start"><div><div class="row" style="gap:14px">'+badge(stTxt,r.status)+(PAIDS.includes(r.status)?badge(docTxt,r.doc):'')+(r.kit?'<span class="badge b-ok">Kit entregue</span>':'')+'</div><h2 style="font-size:26px;margin-top:10px">'+esc(r.name)+'</h2><p class="small muted mono">'+esc(r.protocol)+(r.bib?' · peito '+r.bib:'')+'</p></div><button class="x" data-oa="close" aria-label="Fechar">×</button></div>'+
  '<dl class="kv">'+kv('Percurso',modLabel(r.modality)+' · '+catLabel(r.cat))+kv('País',flagTxt[r.country])+kv('Nascimento',r.birth?new Date(r.birth+'T12:00').toLocaleDateString('pt-BR')+' · '+ageAt(r.birth)+' anos na prova':'—')+
  kv('Documento',esc(r.docType)+' · '+esc(r.cpf?'CPF '+r.cpf:r.docNum)+'<br><span class="small muted mono">'+esc(r.docFile)+'</span>')+kv('E-mail',esc(r.email))+kv('Celular',esc(r.phone))+kv('Camiseta',esc(r.shirt))+kv('Emergência',esc(r.emergency))+
  kv('Pagamento',r.method?money(r.total)+' · '+(r.method==='pix'?'Pix':'cartão '+r.inst+'x')+'<br><span class="small muted">taxa do gateway '+money(gwFee(r))+' · '+fmtDT(r.paidAt||r.created)+'</span>':'—')+
  (r.refundedAt?kv('Reembolso',fmtDT(r.refundedAt)):'')+kv('Aceite dos termos',fmtDT(r.created)+' · IP '+esc(r.ip||'—'))+'</dl>'+act+'</div></div>';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-oa]');if(!b)return;
  const a=b.dataset.oa,id=b.dataset.id,r=id?byId(id):null;
  switch(a){
  case 'logout':DB.org=false;save();go('inicio');break;
  case 'tab':ORG.tab=b.dataset.v;ORG.sel=null;ORG.disp=null;ORG.kitSel=null;render();window.scrollTo(0,0);break;
  case 'open':ORG.sel=id;ORG.confirm=false;render();break;
  case 'close':if(e.target===b||b.tagName==='BUTTON'){ORG.sel=null;render()}break;
  case 'page':ORG.page+=+b.dataset.v;orgTable();break;
  case 'doc-ok':r.doc='aprovado';save();toast('Documento de '+r.name+' aprovado.');render();break;
  case 'doc-no':{const s=document.getElementById('rr-'+id);r.doc='recusado';r.docReason=s?s.value:REASONS[0];save();toast('E-mail enviado para '+r.email+'. Prazo para reenviar: '+fmtD(SIM_TODAY+30*DAY)+'.');render();break}
  case 'remind':toast('Lembrete enviado para '+r.email+'.');break;
  case 'resend':toast('Comprovante reenviado para '+r.email+'.');break;
  case 'refund':ORG.confirm=true;render();break;
  case 'refund-no':ORG.confirm=false;render();break;
  case 'refund-ok':r.status='reembolsado';r.refundedAt=simNow();r.bib=null;save();ORG.sel=null;toast('Reembolso de '+money(r.total)+' pedido ao gateway. Vaga liberada.');render();break;
  case 'goto-disp':ORG.sel=null;ORG.tab='contestacoes';ORG.disp=id;render();break;
  case 'disp-open':ORG.disp=id;render();break;
  case 'disp-send':r.dispute.status='defesa enviada';save();ORG.disp=null;toast('Defesa enviada ao gateway. O banco costuma decidir em 30 a 75 dias.');render();break;
  case 'disp-accept':r.dispute.status='perdida';r.status='estornado';r.bib=null;save();toast(money(r.total)+' devolvidos ao titular do cartão.');render();break;
  case 'kit-sel':ORG.kitSel=id;render();break;
  case 'kit-ok':{const c=document.getElementById('kdoc');if(!c||!c.checked){toast('Marque que você conferiu o documento.');break}r.kit=true;r.kitAt=simNow();save();toast('Kit do peito '+r.bib+' entregue.');ORG.kitQ='';ORG.kitSel=null;render();const i=document.getElementById('kq');if(i)i.focus();break}
  case 'csv':{const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
    const csv=[['protocolo','peito','nome','percurso','categoria','pais','documento','cpf_ou_doc','email','celular','camiseta','pagamento','forma','parcelas','total','documento_status','inscrito_em'].join(',')].concat(oFiltered().map(r=>[r.protocol,r.bib,r.name,modLabel(r.modality),catLabel(r.cat),flagTxt[r.country],r.docType,r.cpf||r.docNum,r.email,r.phone,r.shirt,stTxt[r.status][0],r.method,r.inst,r.total.toFixed(2),docTxt[r.doc][0],fmtDT(r.created)].map(q).join(','))).join('\n');
    try{navigator.clipboard.writeText(csv).then(()=>toast('Planilha copiada. Cole no Excel ou Google Sheets.'),()=>toast('Não deu para copiar neste navegador.'))}catch(x){toast('Não deu para copiar neste navegador.')}break}
  }
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.of;if(k){ORG[k]=e.target.value;ORG.page=0;orgTable()}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.of;if(k&&e.target.tagName==='SELECT'){ORG[k]=e.target.value;ORG.page=0;orgTable()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ORG.sel){ORG.sel=null;render()}if(e.key==='Enter'&&e.target.matches&&e.target.matches('tr[data-oa="open"]')){ORG.sel=e.target.dataset.id;render()}});
document.addEventListener('submit',e=>{
  const f=e.target.dataset.form;
  if(f==='olog'){e.preventDefault();DB.org=true;save();render()}
  if(f==='okit'){e.preventDefault();ORG.kitQ=document.getElementById('kq').value;ORG.kitSel=null;const q=norm(ORG.kitQ).trim();
    const ex=DB.regs.filter(r=>PAIDS.includes(r.status)&&(String(r.bib)===q||norm(r.protocol)===q));if(ex.length===1)ORG.kitSel=ex[0].id;render()}
});

/* countdown */
function tick(){
  clearInterval(tick.i);
  if(route()!=='inicio')return;
  const run=()=>{const left=Math.max(0,EVENT.getTime()-simNow()),set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=String(v).padStart(2,'0')};
    set('cd-d',Math.floor(left/DAY));set('cd-h',Math.floor(left%DAY/36e5));set('cd-m',Math.floor(left%36e5/6e4));set('cd-s',Math.floor(left%6e4/1e3))};
  run();tick.i=setInterval(run,1000);
}

/* events */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){const to=g.dataset.go;if(to==='inscricao'&&(g.dataset.cat||!S.draft)){S.draft=newDraft(g.dataset.cat);S.errors={}}go(to);return}
  const sc=e.target.closest('[data-scroll]');
  if(sc){const el=document.getElementById(sc.dataset.scroll);if(el)el.scrollIntoView();return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='fill'){capture();fill();render()}
  else if(act==='method'){S.pay=a.dataset.v;S.cardErr='';S.errors={};if(S.pay==='pix')S.inst=1;render()}
  else if(act==='copy'){const txt=document.getElementById('pixcode').textContent;try{navigator.clipboard.writeText(txt).then(()=>toast('Código Pix copiado'),()=>selText('pixcode'))}catch(x){selText('pixcode')}}
  else if(act==='pay-pix'){confirmPayment(byId(S.checkout),'pix',1)}
  else if(act==='abandon'){const r=byId(S.checkout);if(r){r.status='abandonado';save()}S.checkout=null;go('inicio')}
  else if(act==='magic'){DB.session=S.login.email.toLowerCase();S.login={email:'',sent:false,err:''};save();render()}
  else if(act==='relogin'){S.login.sent=false;render()}
  else if(act==='logout'){DB.session=null;save();render()}
  else if(act==='cancel'){S.cancel=a.dataset.id;render()}
  else if(act==='cancel-no'){S.cancel=null;render()}
  else if(act==='cancel-ok'){const r=byId(a.dataset.id);r.status='reembolsado';r.refundedAt=simNow();r.bib=null;save();S.cancel=null;toast('Inscrição cancelada. Reembolso pedido ao gateway.');render()}
  else if(act==='receipt')toast('Comprovante reenviado para '+DB.session+'.');
  else if(act==='change')toast('No sistema real, abre o formulário de alteração com a cobrança de '+money(CHANGE_FEE)+'.');
});
function selText(id){const el=document.getElementById(id);if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.actChange==='inst'){S.inst=+el.value;render();return}
  if(route()!=='inscricao'||!el.dataset.f)return;
  const k=el.dataset.f;
  if(['modality','cat','country'].includes(k)){capture();const d=D();if(k==='country')d.docType=DOCS[d.country][0];if(k==='cat')delete S.errors.cat;render()}
  else if(el.type==='file'){capture();delete S.errors[k];render()}
});
document.addEventListener('submit',e=>{
  const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  if(f==='reg'){capture();if(!validate()){render();const bad=document.querySelector('.bad input,.bad select,.chk .err');if(bad)bad.scrollIntoView({block:'center'});return}
    const d=D(),n=DB.regs.length+1;
    const r=Object.assign({},d,{id:'r'+Date.now(),protocol:'3F26-'+String(n).padStart(6,'0'),ip:'177.84.12.201',kit:false,kitAt:null,dispute:null,docReason:'',base:priceOf(d.cat),fee:FEE,interest:0,total:priceOf(d.cat)+FEE,status:'aguardando',created:simNow(),doc:'analise',bib:null,method:null,inst:1,paidAt:null,refundedAt:null});
    DB.regs.push(r);save();S.checkout=r.id;S.pay=r.country==='BR'?'pix':'card';S.inst=1;S.errors={};S.cardErr='';go('checkout')}
  if(f==='card'){const v=id=>document.getElementById(id).value.trim(),n=v('cn').replace(/\D/g,''),e2={};
    if(!luhn(n))e2.cn='Número de cartão inválido.';if(!v('ch'))e2.ch='Preencha este campo.';
    if(!/^(0[1-9]|1[0-2])\/?\d{2}$/.test(v('cx')))e2.cx='Use MM/AA.';if(!/^\d{3,4}$/.test(v('cv')))e2.cv='3 ou 4 dígitos.';
    S.errors=e2;S.cardErr='';if(Object.keys(e2).length){render();return}
    if(n==='4000000000000002'){S.cardErr='Pagamento recusado pelo banco emissor. Tente outro cartão ou use Pix.';render();return}
    confirmPayment(byId(S.checkout),'card',S.inst)}
  if(f==='login'){const em=document.getElementById('lg').value.trim();S.login.email=em;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))S.login.err='Digite um e-mail válido.';
    else if(!DB.regs.some(r=>r.email.toLowerCase()===em.toLowerCase()&&(r.status==='pago'||r.status==='reembolsado')))S.login.err='Não encontramos inscrição com esse e-mail.';
    else{S.login.err='';S.login.sent=true}render()}
});

ensureSeed();
render();
})();
</script>
