<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meia 3 Fronteiras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: página toda branca, fotos da região como único elemento de cor forte; conteúdo numa coluna de 1180px; painel = barra lateral + área de trabalho. Tema único claro, de propósito. */
/* antes: faixas de largura total (topo, hero verde-mata, seções brancas) com conteúdo numa coluna de 1180px; o painel é barra lateral + área de trabalho. */
:root{
  --bg:#FFFFFF;--surface:#F2F5F3;--ink:#0D1F1A;--muted:#5A6A64;--line:#DCE4E0;
  --forest:#0F3B30;--forest-2:#1C5546;--on-forest:#EEF5F1;--on-forest-dim:#A7C1B6;--river:#67BFAE;
  --sun:#FFC22E;--on-sun:#1B1500;
  --good:#16774C;--good-bg:#E2F3E9;--warn:#935600;--warn-bg:#FFF0D3;--crit:#B42318;--crit-bg:#FDE6E2;--chip:#EBEFED;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --w:1180px;color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:var(--w);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:600 12px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;background:var(--sun);color:var(--on-sun);font:700 15px/1 var(--body);padding:15px 22px;text-decoration:none;cursor:pointer;transition:transform 160ms var(--ease-out),filter .15s ease,box-shadow .15s ease;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn:active:not([disabled]){transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:default}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-line:hover{box-shadow:inset 0 0 0 1.5px var(--ink);filter:none}
.btn-ghost-dark{background:transparent;color:var(--on-forest);box-shadow:inset 0 0 0 1.5px rgba(238,245,241,.35)}
.btn-sm{padding:10px 14px;font-size:14px}
.btn-wide{width:100%}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.link.crit{color:var(--crit)}

/* barra de teste */
.testbar{background:var(--ink);color:var(--bg);font-size:13px}
.testbar .wrap{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding-block:8px}
.testbar b{color:var(--sun);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.testbar button{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px;opacity:.85}
.testbar button:hover{opacity:1}
.testbar .sp{flex:1}

/* topo do site */
.site-h{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.site-h .wrap{display:flex;align-items:center;gap:28px;height:64px}
.brand{font:900 22px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.brand i{font-style:normal;color:var(--forest-2)}
.site-h nav{display:flex;gap:24px;flex:1}
.site-h nav a{white-space:nowrap;text-decoration:none;font-weight:500;font-size:15px;color:var(--muted)}
.site-h nav a:hover{color:var(--ink)}
.site-h .acts{display:flex;gap:10px;align-items:center}
@media (max-width:1000px){.site-h nav{display:none}.site-h .acts{margin-left:auto}}
@media (max-width:820px){.site-h .acts{margin-left:auto}.hide-sm{display:none}}

/* hero: banner em tela cheia; menu transparente por cima, que fica branco ao rolar */
.site-h{transition:background-color .25s ease}
.site-h.over:not(.solid){background:transparent}
.site-h.over{margin-bottom:-64px}
.site-h.over:not(.solid) .brand,.site-h.over:not(.solid) .brand i,.site-h.over:not(.solid) nav a{color:#fff}
.site-h.over:not(.solid) .brand,.site-h.over:not(.solid) nav a{text-shadow:0 1px 8px rgba(0,0,0,.35)}
.site-h.over:not(.solid) .btn-line{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
.hero{position:relative;background:#16324a;color:#fff;overflow:hidden;min-height:max(600px,calc(100svh - var(--tbar,0px)));display:flex;flex-direction:column;padding-top:64px}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:30% 40%;max-width:none}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:180px;background:linear-gradient(180deg,rgba(8,20,32,.72) 0%,rgba(8,20,32,.4) 45%,rgba(8,20,32,0) 100%);pointer-events:none;z-index:1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,25,40,0) 38%,rgba(10,25,40,.38) 100%),linear-gradient(180deg,rgba(10,25,40,0) 62%,rgba(10,25,40,.82) 100%);pointer-events:none}
.hero .wrap{position:relative;z-index:2;width:100%}
.hero-main{flex:1;display:flex;justify-content:flex-end;align-items:center;padding-block:40px}
.hero-txt{width:min(520px,44%)}
.hero .eyebrow{color:rgba(255,255,255,.85)}
.h-hero{font:900 clamp(3.2rem,7.2vw,7rem)/.86 var(--display);text-transform:uppercase;letter-spacing:-.005em;margin-top:14px;text-shadow:0 2px 24px rgba(0,20,40,.35)}
.h-hero span{display:block;color:var(--sun)}
.hero .lead{font-size:19px;line-height:1.5;max-width:40ch;margin-top:20px;color:rgba(255,255,255,.94);text-shadow:0 1px 12px rgba(0,20,40,.4)}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero .btn-line{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75)}
.hero .btn-line:hover{box-shadow:inset 0 0 0 1.5px #fff}
.hero-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding-block:72px}
.hero-facts div{padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.hero-facts b{font:800 clamp(28px,3.4vw,48px)/1 var(--display);text-transform:uppercase;color:#fff;white-space:nowrap}
@media (max-width:900px){
  .hero{min-height:calc(100svh - var(--tbar,0px))}
  .hero-bg{object-position:24% 30%}
  .hero::after{background:linear-gradient(180deg,rgba(10,25,40,0) 26%,rgba(10,25,40,.6) 50%,rgba(10,25,40,.92) 100%)}
  .hero-main{align-items:flex-end;justify-content:flex-start;padding-block:24px 16px}
  .hero-txt{width:100%}
  .h-hero{font-size:clamp(2.9rem,13vw,4.6rem)}
  .hero .lead{font-size:16px;margin-top:14px}
  .hero-cta{margin-top:20px}
  .hero-facts{grid-template-columns:1fr 1fr}
  .hero-facts{gap:16px;padding-block:56px}
  .hero-facts b{font-size:26px}
}
.photo{margin:0;position:relative;border-radius:14px;overflow:hidden;background:var(--surface);max-width:100%}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.photo figcaption{position:absolute;left:12px;bottom:12px;font-size:11px;color:#fff;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:4px;max-width:calc(100% - 24px)}

/* mapa do percurso */
.map{margin:0;max-width:100%;border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--surface)}
.map svg{width:100%;height:auto;display:block}
.map figcaption{font-size:12px;color:var(--muted);margin-top:8px}
.map .land{font:800 15px/1 var(--display);letter-spacing:.24em;fill:var(--muted)}
.map .riv{fill:none;stroke:#9CCFD8;stroke-linecap:round}
.map .r21{fill:none;stroke:var(--forest-2);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.map .r10{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:2 8;stroke-linecap:round;stroke-linejoin:round}
.map .pt{fill:var(--bg);stroke-width:3}
.map .lbl{font:600 12px/1 var(--body);fill:var(--ink)}
.map .tag{font:900 22px/1 var(--display)}
.map .pulse{fill:var(--sun);transform-origin:center;transform-box:fill-box;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
@media (prefers-reduced-motion:reduce){.map .pulse{animation:none;opacity:0}}
.course{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:stretch}
.course .photo{min-height:100%}
.course-txt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:36px}
.course-txt b{display:block;font:800 22px/1.1 var(--display);text-transform:uppercase;margin-bottom:6px}
.course-txt p{font-size:15px;color:var(--muted)}
@media (max-width:860px){.course,.course-txt{grid-template-columns:1fr}.course .photo{aspect-ratio:4/3}}

/* seções */
section[id]{scroll-margin-top:64px}
.sec{padding-block:clamp(80px,11vw,136px)}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px 40px;margin-bottom:clamp(36px,5vw,64px)}
.h2{font:900 clamp(2.4rem,5vw,3.8rem)/.95 var(--display);text-transform:uppercase;margin-top:10px}
.sec-h p.muted{max-width:46ch}

/* distâncias */
.dists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.dist{border:1px solid var(--line);border-radius:14px;padding:0 32px 32px;display:flex;flex-direction:column;gap:22px;min-width:0;overflow:hidden}
.dist .photo{margin:0 -32px;width:calc(100% + 64px);max-width:none;border-radius:0;aspect-ratio:16/9}
.dist-top{display:flex;justify-content:space-between;align-items:start;gap:16px}
.km{font:900 clamp(5rem,11vw,8.5rem)/.8 var(--display);letter-spacing:-.02em}
.price{text-align:right}
.price b{display:block;font:800 34px/1 var(--display)}
.price span{font-size:13px;color:var(--muted)}
.route{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:15px}
.route dt{color:var(--muted)}
.route dd{margin:0}
.dist .btn{margin-top:auto;align-self:start}
@media (max-width:760px){.dists{grid-template-columns:1fr}.dist{padding:0 22px 24px}.dist .photo{margin:0 -22px;width:calc(100% + 44px)}}

/* kit Fronteira Pro: faixa escura de destaque */
.equip{background:#0E2233;color:#fff}
.equip .wrap{padding-block:clamp(80px,11vw,136px)}
.equip .eyebrow{color:var(--sun)}
.equip-g{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:center}
.equip-h{font:900 clamp(3rem,7vw,6rem)/.86 var(--display);text-transform:uppercase;margin-top:12px}
.equip-h span{display:block;color:var(--sun)}
.equip-lead{font-size:18px;line-height:1.55;color:rgba(255,255,255,.82);max-width:46ch;margin-top:20px}
.equip-list{list-style:none;margin:32px 0 36px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.equip-list li{display:flex;align-items:baseline;gap:14px;padding:10px 0;font:700 clamp(20px,2vw,24px)/1.15 var(--display);text-transform:uppercase;letter-spacing:.02em}
.equip-list li span{font:500 12px/1 var(--mono);color:var(--sun);letter-spacing:0}
.equip-img{margin:0;border-radius:14px;overflow:hidden;aspect-ratio:4/5;max-width:100%}
.equip-img img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block}
.extras{margin-top:clamp(72px,9vw,112px)}
.extras-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;margin-top:20px}
.extra h3{font:800 28px/1 var(--display);text-transform:uppercase}
.extra p{color:rgba(255,255,255,.75);font-size:15px;margin-top:10px;max-width:36ch}
@media (max-width:860px){.equip-g{grid-template-columns:1fr;gap:36px}.equip-img{aspect-ratio:1/1}.extras{margin-top:56px}.extras-g{grid-template-columns:1fr;gap:28px}}
@media (max-width:480px){.equip-list{grid-template-columns:1fr}}
.kit-inc{display:flex;justify-content:space-between;align-items:center;gap:16px;border:1.5px solid var(--ink);border-radius:10px;padding:18px 20px}
.kit-inc b{display:block;font-weight:700;font-size:17px}
.kit-inc .d{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.kit-inc .pr{font-weight:700;white-space:nowrap}

/* cronograma */
.crono{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.crono-card{border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0}
.crono-h{display:flex;align-items:center;gap:14px}
.crono-h h3{font:800 28px/1 var(--display);text-transform:uppercase}
.crono-role{font-size:13px;font-weight:600;color:var(--forest-2);margin-top:4px}
.crono-place{font-size:14px;color:var(--muted);line-height:1.45}
.crono-list{list-style:none;margin:6px 0 0;padding:0}
.crono-list li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:baseline;padding:9px 0}
.crono-list time{font:800 24px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--muted)}
.crono-list span{font-weight:600;font-size:15px}
.crono-list li.hl time{color:var(--ink)}
.crono-list li.hl span::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sun);margin-left:8px;vertical-align:middle}
.flag{flex:none;width:34px;height:23px;border-radius:3px;box-shadow:0 0 0 1px var(--line);position:relative;overflow:hidden}
.flag-py{background:linear-gradient(#D52B1E 0 33.3%,#fff 33.3% 66.6%,#0038A8 66.6%)}
.flag-ar{background:linear-gradient(#74ACDF 0 33.3%,#fff 33.3% 66.6%,#74ACDF 66.6%)}
.flag-ar::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#F6B40E}
.flag-br{background:#009C3B}
.flag-br::before{content:"";position:absolute;inset:3px 5px;background:#FFDF00;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.flag-br::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#002776}
@media (max-width:900px){.crono{grid-template-columns:1fr}}

/* informações */
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}
.info h3{font:700 19px/1.3 var(--body);margin-bottom:10px}
.info p{color:var(--muted);font-size:15px;max-width:38ch}
@media (max-width:820px){.info{grid-template-columns:1fr;gap:28px}}

/* dúvidas */
.faq{max-width:780px}
.faq summary{list-style:none;cursor:pointer;padding:20px 40px 20px 0;font-weight:600;font-size:17px;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:4px;top:16px;font:400 26px/1 var(--body);color:var(--muted);transition:transform 200ms var(--ease-out),color .2s ease}
.faq details[open] summary::after{transform:rotate(45deg);color:var(--ink)}
.faq details p{padding:0 0 22px;color:var(--muted);max-width:64ch}

/* chamada final + rodapé */
.final{position:relative;color:#fff;background:#24413a url(img/parana.jpg) center 60%/cover no-repeat}
.final::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,20,16,.78),rgba(6,20,16,.25))}
.final .wrap{position:relative}
.final .wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;padding-block:96px}
.final h2{font:900 clamp(2.2rem,5vw,3.6rem)/.95 var(--display);text-transform:uppercase}
.final p{color:rgba(255,255,255,.82);margin-top:10px}
.credits{font-size:12px;color:var(--muted)}
.credits summary{cursor:pointer}
.credits ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.foot .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;padding-block:32px;font-size:14px;color:var(--muted)}
.foot nav{display:flex;flex-wrap:wrap;gap:12px 22px}
.foot a{text-decoration:none}
.foot a:hover{color:var(--ink)}

/* páginas internas (inscrição, área do atleta) */
.page{padding-block:48px 96px}
.page-h{margin-bottom:36px}
.page-h .h2{margin-top:8px}
.back{font-size:14px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.form-g{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:48px;align-items:start}
@media (max-width:900px){.form-g{grid-template-columns:1fr}}
.step{padding-block:28px;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:0}
.step h2{font:700 20px/1.3 var(--body);margin-bottom:18px}
.opts{display:grid;gap:12px}
.opts-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:620px){.opts-2,.opts-3{grid-template-columns:1fr}}
.opt{position:relative;display:flex;flex-direction:column;gap:4px;border:1.5px solid var(--line);border-radius:8px;padding:16px 18px;cursor:pointer;min-width:0}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:hover{border-color:var(--muted)}
.opt:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt:has(input:focus-visible){outline:2px solid var(--sun);outline-offset:2px}
.opt .big{font:900 34px/1 var(--display)}
.opt .t{font-weight:600}
.opt .d{font-size:13px;color:var(--muted)}
.opt .pr{font-weight:600;font-size:15px;margin-top:4px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
.fields .full{grid-column:1/-1}
@media (max-width:620px){.fields{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:14px;font-weight:500}
.f input,.f select{width:100%;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);padding:12px 13px;font-size:16px}
.f input:focus,.f select:focus{outline:none;border-color:var(--ink)}
.f .err{font-size:13px;color:var(--crit)}
.f.bad input,.f.bad select{border-color:var(--crit)}
.f .hint{font-size:13px;color:var(--muted)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ink);flex:none}
.fill-row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:26px;padding:12px 14px;background:var(--surface);border-radius:8px}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:14px}
.summary .rowx{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.summary .rowx span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.summary .tot{border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;align-items:baseline}
.summary .tot b{font:800 32px/1 var(--display)}
@media (max-width:900px){.summary{position:static}}

/* checkout (tela do gateway) */
.gw{min-height:100%;background:var(--surface);padding-block:40px 80px}
.gw-box{max-width:460px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden}

/* ---------- roteamento ---------- */
const LANDING_ANCHORS=['prova','percurso','kits','cronograma','info','duvidas'];
let lastView=null;
function view(){const h=location.hash.slice(1)||'inicio';return LANDING_ANCHORS.includes(h)?'inicio':h}
function go(h){if(location.hash.slice(1)===h)render(true);else location.hash=h}
function html(){const v=view();return testBar()+({inscricao:vForm,pagamento:vCheckout,atleta:vPortal,org:vOrg}[v]||vLanding)()}
function render(force){
  const v=view(),h=location.hash.slice(1);
  $('#app').innerHTML=html();setTbar();
  if(v!==lastView||force){if(LANDING_ANCHORS.includes(h))goSection(h,false);else window.scrollTo(0,0)}
  else if(LANDING_ANCHORS.includes(h))goSection(h)
  if(v!=='atleta')FLASH='';
  setupMotion(v);routeIn(v,v!==lastView);setHdr();lastView=v;
}
function rerender(){
  const a=document.activeElement,id=a&&a.id,s=a&&'selectionStart' in a?(()=>{try{return a.selectionStart}catch(e){return null}})():null;
  $('#app').innerHTML=html();
  if(id){const el=document.getElementById(id);if(el){el.focus({preventScroll:true});try{if(s!=null)el.setSelectionRange(s,s)}catch(e){}}}
}
addEventListener('hashchange',()=>render());
/* revelação ao rolar, seção atual no menu, entrada do hero e troca de tela */
const RM=matchMedia('(prefers-reduced-motion:reduce)');
const RV_GROUPS=['.sec-h','.dists>.dist','.course>*','.course-txt>div','.equip-txt>:not(ul)','.equip-list>li','.equip-img','.extras>.eyebrow','.extras-g>.extra','.crono>.crono-card','.info>div','.faq>details','.final .wrap>*'];
let rvIO=null,spyIO=null,firstPaint=true;
const RV_FADE=['.dist','.course>*','.equip-img','.crono-card'];
/* mostra o elemento e, depois da transição, tira os atributos de animação para ele virar conteúdo normal */
function revealDone(el){
  el.classList.add('in');
  const jumping=document.documentElement.classList.contains('jumping');
  const wait=jumping?0:700+(parseInt(el.style.getPropertyValue('--d'))||0);
  setTimeout(()=>{el.removeAttribute('data-rv');el.classList.remove('in');el.style.removeProperty('--d')},wait);
}
if('IntersectionObserver' in window)document.documentElement.classList.add('js-rv');
function setupMotion(v){
  if(rvIO)rvIO.disconnect();if(spyIO)spyIO.disconnect();
  if(v!=='inicio'||!('IntersectionObserver' in window))return;
  rvIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting||e.boundingClientRect.bottom<0){revealDone(e.target);rvIO.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px',threshold:.12});
  RV_GROUPS.forEach(sel=>document.querySelectorAll(sel).forEach((el,i)=>{el.dataset.rv=RV_FADE.some(f=>el.matches(f))?'fade':'';el.style.setProperty('--d',Math.min(i,6)*60+'ms');rvIO.observe(el)}));
  spy();
}
function routeIn(v,changed){
  const de=document.documentElement;
  if(v==='inicio'&&firstPaint&&!LANDING_ANCHORS.includes(location.hash.slice(1))){de.classList.add('intro');setTimeout(()=>de.classList.remove('intro'),1800)}
  else if(changed&&!firstPaint&&['inscricao','pagamento','atleta'].includes(v)){const m=$('#app main');if(m&&m.animate)m.animate(RM.matches?[{opacity:0},{opacity:1}]:[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:240,easing:'cubic-bezier(.23,1,.32,1)'})}
  firstPaint=false;
}
/* menu: seção ativa = última cujo topo já passou da linha de leitura (logo abaixo do menu) */
let spyLock=0;
function spy(){
  if(Date.now()<spyLock)return;
  const links=[...document.querySelectorAll('.site-h nav a')];if(!links.length)return;
  const line=64+innerHeight*.25;let cur='';
  LANDING_ANCHORS.forEach(id=>{const el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<=line)cur=id});
  if(innerHeight+scrollY>=document.documentElement.scrollHeight-4)cur=LANDING_ANCHORS[LANDING_ANCHORS.length-1];
  links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+cur));
}
/* âncoras da landing: rola direto até a seção, sem redesenhar a página */
function goSection(id,smooth=true){
  const el=document.getElementById(id);if(!el)return false;
  const y=el.getBoundingClientRect().top+scrollY-64;
  document.querySelectorAll('.site-h nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+id));
  spyLock=Date.now()+1200;
  const de=document.documentElement;de.classList.add('jumping');clearTimeout(goSection.t);goSection.t=setTimeout(()=>de.classList.remove('jumping'),1200);
  document.querySelectorAll('[data-rv]').forEach(r=>{if(r.getBoundingClientRect().top+scrollY<y+innerHeight)revealDone(r)});
  window.scrollTo({top:Math.max(0,y),behavior:smooth&&!RM.matches?'smooth':'auto'});
  try{history.replaceState(null,'','#'+id)}catch(e){}
  return true;
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey)return;
  const id=a.getAttribute('href').slice(1);
  if(view()==='inicio'&&LANDING_ANCHORS.includes(id)&&goSection(id)){e.preventDefault()}
},true);
let spyRaf=0;addEventListener('scroll',()=>{if(!spyRaf)spyRaf=requestAnimationFrame(()=>{spyRaf=0;spy()})},{passive:true});
function setHdr(){const h=document.querySelector('.site-h.over');if(h)h.classList.toggle('solid',scrollY>24)}
addEventListener('scroll',setHdr,{passive:true});
function setTbar(){const t=document.querySelector('.testbar');document.documentElement.style.setProperty('--tbar',(t?t.offsetHeight:0)+'px')}

  else if(k==='acct'){Object.assign(DB.admin,{name:g('name'),role:g('role'),email:g('email'),phone:g('phone')});logA('Atualizou os dados da conta');save();toast('Conta salva.');rerender()}
  else if(k==='orgi'){Object.assign(DB.orgi,{name:g('name'),cnpj:g('cnpj'),city:g('city'),email:g('email')});logA('Atualizou os dados da organização');save();toast('Organização salva.');rerender()}
  else if(k==='team'){if(!g('name')||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(g('email'))){toast('Informe nome e e-mail para convidar.');return}DB.team.push({id:'t'+Date.now(),name:g('name'),email:g('email'),role:g('role')});logA('Convidou '+g('name'));save();toast('Convite enviado para '+g('email')+'.');rerender()}
});
document.addEventListener('change',e=>{const t=e.target;if(t.type==='radio'&&t.dataset.f){F[t.dataset.f]=t.value;rerender()}});

render(true);
</script>
